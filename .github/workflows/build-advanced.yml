name: Advanced Build with vcpkg Caching

on:
  # Temporarily disabled for debugging
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        triplet: [x64-windows, x64-windows-static]
        include:
          - os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: x64

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup vcpkg with advanced caching
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgJsonGlob: 'vcpkg.json'
        # Let CMake handle the installation to avoid double installation
        runVcpkgInstall: false
        vcpkgGitCommitId: '74e6536215718009aae747d86d84b78376bf9e09'

    - name: Configure CMake
      run: |
        echo "=== Cache Status Before CMake ==="
        & "${{ github.workspace }}\vcpkg\vcpkg.exe" list
        echo ""
        echo "=== Starting CMake Configuration ==="
        cmake -B build -S . `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
          -G "${{ matrix.generator }}" `
          -A ${{ matrix.arch }} `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        echo ""
        echo "=== Cache Status After CMake ==="
        & "${{ github.workspace }}\vcpkg\vcpkg.exe" list

    - name: Build
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test executable
      shell: cmd
      run: |
        build\bin\${{ env.BUILD_TYPE }}\vcpkg-test-app.exe

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: vcpkg-test-app-${{ matrix.triplet }}-${{ env.BUILD_TYPE }}
        path: |
          build/bin/${{ env.BUILD_TYPE }}/vcpkg-test-app.exe
        retention-days: 7